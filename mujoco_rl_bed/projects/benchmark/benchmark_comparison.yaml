# Config of the comparison reported in `benchmark_comparisons.md` (see compare.yaml for what every key means).
# Run:  python projects/benchmark/compare.py config=projects/benchmark/benchmark_comparison.yaml
methods: [spiral_rule, forge, tacdiff]

episodes: 20
seed: 2000
time_max: 20.0
workers: 4              # ~1 GB RAM each; keep <= RAM in GB / 1.5 and < CPU cores

conditions:
  shapes: [cylinder, cuboid, octagon]
  clearance_mm: [0.25, 0.5]
  hole_error_mm: ["2", "4"]     # exactly 2 / 4 mm, random direction
  tilt_deg: ["0", "5"]          # exactly 0 / 5 deg, random axis
  friction: ["0.4", "0.7"]
  yaw_deg: ["0"]                # hole yaw error [deg], random sign (non-round shapes): "a" or "a-b"

peg_half_size_mm: 4.0

paper_error: {enabled: false, tol_mm: 2.0, tol_deg: 2.0}

models:
  forge_run: projects/forge/runs/jitter_but_works
  tacdiff_model: ../diffusion/TacDiffusion/output/TacDiffusion_model_256.onnx   # authors' 256 model (512: 45 ms/call here, 256: 14 ms)
  spiral_rl_yaw_run: projects/compliant_RL/runs/spiral_RL_yaw   # compliant_peg_s3_mixed run (spiral + trigger + local x, y, yaw)

spiral:
  f_search_n: 1.5
  pitch_mm: 0.8
  r_max_mm: 4.6
  speed_mm_s: 10.0

spiral_rl_yaw:
  t_local: 6.0          # [s] per local phase before the spiral resumes
  deterministic: true   # policy mean
  trigger_model: ""     # hole-trigger model: "" = default, or a file name in projects/compliant_RL/models/

forge:
  f_th: 7.5
  deterministic: false
  ema: 1.0

view:
  enabled: false
  method: spiral_rule
  realtime: true
  pause_s: 1.0

out: ""                 # "" = new results/compare_<time>/ (results/benchmark_comparison/ holds the reported run)
